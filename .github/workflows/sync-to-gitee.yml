name: Sync to Gitee
on:
  push:
    branches: [main]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to Gitee mirror
        run: |
          git remote add gitee https://liliwen919:${{ secrets.GITEE_TOKEN }}@gitee.com/liliwen919/lottery-demo.git
          git push gitee main:main
